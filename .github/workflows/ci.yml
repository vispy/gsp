name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install validation tools and workspace
        run: |
          python -m pip install --upgrade pip
          python -m pip install "mypy>=1.15,<3" "pytest>=8,<10" "ruff==0.16.1" "uv>=0.7,<1"
          python -m pip install -e packages/gsp-core -e packages/gsp-matplotlib -e packages/gsp-datoviz
      - name: Test
        run: python -m pytest -q packages conformance tools/tests
      - name: Type check
        run: python -m mypy packages/gsp-core/src packages/gsp-matplotlib/src packages/gsp-datoviz/src --strict --show-error-codes
      - name: Lint
        run: |
          python -m ruff check packages conformance tools
          python -m ruff format --check packages conformance tools
      - name: Check specification traceability and docs
        run: |
          python tools/spec_traceability.py --check
          python -m pip install "mkdocs-material>=9,<10"
          python -m mkdocs build --strict --site-dir "$RUNNER_TEMP/gsp-docs"
      - name: Build wheels
        run: |
          mkdir -p "$RUNNER_TEMP/gsp-dist"
          uv build --wheel --package gsp-core --out-dir "$RUNNER_TEMP/gsp-dist"
          uv build --wheel --package gsp-matplotlib --out-dir "$RUNNER_TEMP/gsp-dist"
          uv build --wheel --package gsp-datoviz --out-dir "$RUNNER_TEMP/gsp-dist"
      - name: Test installed wheels
        run: |
          python -m venv "$RUNNER_TEMP/gsp-wheel-venv"
          "$RUNNER_TEMP/gsp-wheel-venv/bin/python" -m pip install "$RUNNER_TEMP"/gsp-dist/*.whl "pytest>=8,<10"
          wheel_tests="$RUNNER_TEMP/gsp-wheel-tests"
          mkdir -p "$wheel_tests"
          cp -R "$GITHUB_WORKSPACE/packages" "$wheel_tests/packages"
          cp -R "$GITHUB_WORKSPACE/conformance" "$wheel_tests/conformance"
          cd "$wheel_tests"
          env -u PYTHONPATH PYTHONNOUSERSITE=1 "$RUNNER_TEMP/gsp-wheel-venv/bin/python" - <<PY
          import pathlib
          import sys

          import gsp
          import gsp_datoviz
          import gsp_matplotlib

          workspace = pathlib.Path("$GITHUB_WORKSPACE").resolve()
          for module in (gsp, gsp_datoviz, gsp_matplotlib):
              path = pathlib.Path(module.__file__).resolve()
              if workspace == path or workspace in path.parents:
                  raise SystemExit(f"{module.__name__} imported from workspace: {path}")
              prefix = pathlib.Path(sys.prefix).resolve()
              if prefix != path and prefix not in path.parents:
                  raise SystemExit(f"{module.__name__} imported outside wheel venv: {path}")
              print(f"{module.__name__}: {path}")
          PY
          env -u PYTHONPATH PYTHONNOUSERSITE=1 "$RUNNER_TEMP/gsp-wheel-venv/bin/python" -m pytest -q packages conformance
