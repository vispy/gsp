[project]
name = "gsp-core"
version = "0.2.0a1"
description = "Backend-independent graphics session protocol for scientific visualization."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "VisPy developers" }]
requires-python = ">=3.13,<4"
dependencies = ["numpy>=2.3,<3"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/vispy/gsp"
Documentation = "https://github.com/vispy/gsp/tree/main/docs"
Repository = "https://github.com/vispy/gsp"
Issues = "https://github.com/vispy/gsp/issues"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gsp"]
