[project]
name = "gsp-datoviz"
version = "0.2.0a1"
description = "Datoviz v0.4 GPU backend for GSP."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "VisPy developers" }]
requires-python = ">=3.13,<4"
dependencies = ["gsp-core==0.2.0a1"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/vispy/gsp"
Documentation = "https://github.com/vispy/gsp/tree/main/docs"
Repository = "https://github.com/vispy/gsp"
Issues = "https://github.com/vispy/gsp/issues"

[project.entry-points."gsp.backends"]
datoviz = "gsp_datoviz.plugin:get_provider"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gsp_datoviz"]

[tool.uv.sources]
gsp-core = { workspace = true }
